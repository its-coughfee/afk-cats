<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
    color: #fff;
  }

  /* ── Background layers for crossfade ── */
  .bg-layer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 2s ease-in-out;
    opacity: 0;
    z-index: 0;
  }
  .bg-layer.active { opacity: 1; }

  /* Dark overlay for text readability */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    transition: background 2s ease-in-out;
  }
  .overlay.ui-top {
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.6) 0%,
      rgba(0,0,0,0.15) 45%,
      rgba(0,0,0,0.15) 60%,
      rgba(0,0,0,0.55) 100%
    );
  }
  .overlay.ui-center {
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0.25) 35%,
      rgba(0,0,0,0.25) 65%,
      rgba(0,0,0,0.55) 100%
    );
  }
  .overlay.ui-bottom {
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0.15) 40%,
      rgba(0,0,0,0.25) 55%,
      rgba(0,0,0,0.65) 100%
    );
  }

  /* ── Content container — shifts based on photo ── */
  .content {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: justify-content 0.8s;
  }
  .content.ui-top {
    justify-content: flex-start;
    padding-top: 10vh;
  }
  .content.ui-center {
    justify-content: center;
  }
  .content.ui-bottom {
    justify-content: flex-end;
    padding-bottom: 14vh;
  }

  /* ── AFK display ── */
  #afk {
    display: none;
  }

  .afk-label {
    font-size: 7rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-indent: 0.25em;
    color: #fff;
    text-shadow: 0 0 60px rgba(0,0,0,0.5);
    margin-bottom: 0.1em;
  }

  .back-line {
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 0.3em;
  }

  .back-time {
    font-size: 2.8rem;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 0 40px rgba(0,0,0,0.4);
    margin-bottom: 1em;
  }

  .countdown {
    font-size: 2rem;
    font-weight: 300;
    color: rgba(255,255,255,0.75);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }

  /* ── Attribution bar ── */
  .attribution {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 0.7em 1.2em;
    font-size: 0.75rem;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    text-align: left;
    transition: opacity 2s ease-in-out;
  }
  .attribution a {
    color: rgba(255,255,255,0.6);
    text-decoration: none;
  }
  .attribution a:hover {
    color: rgba(255,255,255,0.85);
    text-decoration: underline;
  }
  /* Standing credit for the cat drawing the bot's avatar is built from. It sits
     under the photo credit, which the script rewrites on every photo change, so
     the photo credit is lifted clear of the bottom edge to make room. */
  #attribution {
    bottom: 2.1em;
  }
  .attribution.artist-credit {
    bottom: 0;
  }

</style>
</head>
<body>

<div class="bg-layer" id="bg1"></div>
<div class="bg-layer" id="bg2"></div>
<div class="overlay ui-center" id="overlay"></div>

<div class="content ui-center" id="content">
  <div id="afk">
    <div class="afk-label">AFK</div>
    <div class="back-line">back at</div>
    <div class="back-time" id="backTime"></div>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<div class="attribution" id="attribution"></div>
<div class="attribution artist-credit">Cat drawing by <a href="https://thenounproject.com/icon/cat-8273703/" target="_blank" rel="noopener">inmyheart</a> from Noun Project</div>

<script>
  // ── Cat photos from Pexels ──
  // ui: where to place the UI so it doesn't cover the cat's face
  //   "top"    = cat is center/bottom of frame
  //   "center" = cat is at edges, center is clear
  //   "bottom" = cat is top/center-top of frame
  const photos = [
    { id: 7061576,  ext:'jpeg', photographer:'Crisher P.H.',        username:'crisher',                       ui:'bottom' },  // tabby on rock, fills center
    { id: 1041099,  ext:'jpeg', photographer:'lilartsy',             username:'lilartsy',                      ui:'bottom' },  // cat peeks through yellow blossoms, center
    { id: 243770,   ext:'jpeg', photographer:'Pixabay',              username:'theglory-77669',                ui:'top' },     // cat among autumn leaves, lower half
    { id: 17041911, ext:'jpeg', photographer:'Ana Tinca',            username:'ana-tinca-264849644',           ui:'top' },     // calico in flowers, lower center
    { id: 14072059, ext:'jpeg', photographer:'Selcuk Calisir',      username:'selcuk-calisir-56680108',       ui:'top' },     // three cats on rocks, center-low
    { id: 14518699, ext:'jpeg', photographer:'Anna Astakhova',      username:'anna-astakhova-75707674',       ui:'top' },     // two cats by sea, lower half
    { id: 31192222, ext:'jpeg', photographer:'Sezgin Kaya',         username:'sezgin-kaya-81430309',          ui:'top' },     // fluffy cats sunset, lower center
    { id: 20041689, ext:'jpeg', photographer:'Eyüpcan Timur',       username:'eyupcan-timur-424989336',       ui:'top' },     // cat silhouettes at sunset, bottom
    { id: 38838989, ext:'jpeg', photographer:'Mytho',               username:'mytho',                         ui:'bottom' },  // cats on garden fence, center
    { id: 11931799, ext:'jpeg', photographer:'Lubomir Vladikov',    username:'lubomir-vladikov-218031986',    ui:'top' },     // ginger cats in garden path, lower
    { id: 16681861, ext:'jpeg', photographer:'Molnár Tamás',        username:'molnartamasphotography',        ui:'top' },     // cat sleeping on ground, bottom
    { id: 38509612, ext:'jpeg', photographer:'Acrypt Photography',  username:'acrypt-photography-584977681',  ui:'top' },     // cat lounging in garden, center-low
    { id: 39101867, ext:'jpeg', photographer:'Nurullah Ü.',         username:'nurullah-u-2150008420',         ui:'top' },     // cat silhouette Istanbul, bottom half
    { id: 25650506, ext:'jpeg', photographer:'İsmail Akçayır',      username:'i-smail-akcayir-155326478',     ui:'top' },     // ginger cat on coastal rocks, center-low
    { id: 18181312, ext:'jpeg', photographer:'Harun',               username:'harun-15114174',                ui:'top' },     // tabby by seaside, center-low
    { id: 38734656, ext:'jpeg', photographer:'Nekibek',             username:'nekibek',                       ui:'top' },     // Maine Coon sunset, lower center
    { id: 4051431,  ext:'jpeg', photographer:'Gottapics',           username:'gottapics',                     ui:'bottom' },  // cats among cacti, center
    { id: 37769733, ext:'jpeg', photographer:'Ev4r137',             username:'ev4r137',                       ui:'bottom' },  // white cat on tree stump, center
    { id: 37283805, ext:'jpeg', photographer:'Muffinlandge',        username:'muffinlandge',                  ui:'bottom' },  // black and white cat, center
    { id: 38642727, ext:'jpeg', photographer:'Mohammad J.',         username:'mohammad-j-2147534405',         ui:'top' },     // tabby in autumn leaves, center-low
  ];

  function imgUrl(p) {
    return `https://images.pexels.com/photos/${p.id}/pexels-photo-${p.id}.${p.ext}?auto=compress&cs=tinysrgb&w=1920&h=1080&fit=crop`;
  }
  function profileUrl(p) { return `https://www.pexels.com/@${p.username}/`; }
  function photoUrl(p) { return `https://www.pexels.com/photo/${p.id}/`; }

  let order = [];
  let currentIdx = 0;
  let activeBg = 1;
  let cycleTimer = null;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function preloadImage(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  function setUIPosition(pos) {
    const content = document.getElementById('content');
    const overlay = document.getElementById('overlay');
    content.className = 'content ui-' + pos;
    overlay.className = 'overlay ui-' + pos;
  }

  function showPhoto(idx) {
    const photo = photos[order[idx]];
    const url = imgUrl(photo);

    const incoming = activeBg === 1 ? 'bg2' : 'bg1';
    const outgoing = activeBg === 1 ? 'bg1' : 'bg2';

    const inEl = document.getElementById(incoming);
    inEl.style.backgroundImage = `url(${url})`;

    preloadImage(url).then(() => {
      inEl.classList.add('active');
      document.getElementById(outgoing).classList.remove('active');
      activeBg = activeBg === 1 ? 2 : 1;
      setUIPosition(photo.ui);
    });

    const attr = document.getElementById('attribution');
    attr.innerHTML = `Photo by <a href="${profileUrl(photo)}" target="_blank" rel="noopener">${photo.photographer}</a> on <a href="${photoUrl(photo)}" target="_blank" rel="noopener">Pexels</a>`;
  }

  function nextPhoto() {
    currentIdx = (currentIdx + 1) % order.length;
    if (currentIdx === 0) order = shuffle([...Array(photos.length).keys()]);
    showPhoto(currentIdx);
  }

  function startCycling() {
    order = shuffle([...Array(photos.length).keys()]);
    currentIdx = 0;
    showPhoto(currentIdx);
    cycleTimer = setInterval(nextPhoto, 20 * 60 * 1000);
  }

  startCycling();

  // ── AFK state, driven by the bot ──
  // The page never decides anything. It asks the Worker whether its own person
  // is away, and draws whatever it is told. `/afk` and `/back` in Discord are
  // the only things that change it.

  const SIGN_ID = window.__SIGN_ID__ || '';
  const TIMEZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const POLL_MS = 15 * 1000;

  let targetMs = null;
  let ticker = null;

  async function poll() {
    if (!SIGN_ID) return;
    try {
      const res = await fetch(
        `/api/sign/${SIGN_ID}?tz=${encodeURIComponent(TIMEZONE)}`,
        { cache: 'no-store' }
      );
      if (!res.ok) return;                 // a blip leaves the sign as it is
      const state = await res.json();
      applyState(state.afk ? state.until : null);
    } catch (e) {
      // Offline or a hiccup: keep showing the last known state and try again.
    }
  }

  function applyState(until) {
    if (until === targetMs) return;
    targetMs = until;

    const afkEl = document.getElementById('afk');
    if (targetMs === null) {
      if (ticker) { clearInterval(ticker); ticker = null; }
      afkEl.style.display = 'none';        // photos only
      return;
    }

    document.getElementById('backTime').textContent =
      new Date(targetMs).toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', hour12: true,
        timeZoneName: 'short'
      });
    afkEl.style.display = 'block';
    tick();
    if (!ticker) ticker = setInterval(tick, 1000);
  }

  function tick() {
    if (targetMs === null) return;
    const el = document.getElementById('countdown');
    const diff = targetMs - Date.now();
    // Past the return time the counter doesn't stop — it turns around and
    // climbs, so being late stays visible.
    el.textContent = (diff < 0 ? '+ ' : '') + duration(Math.abs(diff));
  }

  function duration(ms) {
    const hrs  = Math.floor(ms / 3600000);
    const mins = Math.floor((ms % 3600000) / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    const parts = [];
    if (hrs > 0) parts.push(hrs + 'h');
    parts.push(String(mins).padStart(2,'0') + 'm');
    parts.push(String(secs).padStart(2,'0') + 's');
    return parts.join(' ');
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
